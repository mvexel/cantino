[package]
name = "cantino"
version = "0.2.0"
edition = "2024"
description = "Cantino: an offline OpenStreetMap SDK core (SQLite area store, C ABI) for mobile apps"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# PBF decoding (pure Rust; flate2 for zlib blobs).
osmpbf = "0.3.8"
# OSM XML: the editing API's format and the test fixture's.
quick-xml = "0.42"
# `bundled` compiles SQLite from source (with the R-tree module) for every
# target, so phones do not depend on the platform's SQLite version.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tempfile = "3.27.0"
# gzip for PMTiles directories/metadata (basemap extract); already in the
# tree via osmpbf.
flate2 = "1.1.10"

[dev-dependencies]
# HTTP client for examples/basemap_extract.rs only; never shipped.
ureq = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[profile.release]
# Matches the spike's measured configuration (spike/sqlite-b).
lto = "thin"
